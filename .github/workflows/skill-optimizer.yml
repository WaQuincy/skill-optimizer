name: Skill Optimizer

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode
        required: true
        default: eval-only
        type: choice
        options:
          - eval-only
          - optimize
          - all-enabled
      pack:
        description: Pack slug to evaluate
        required: true
        default: task_initiation

concurrency:
  group: skill-optimizer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  skill-optimizer:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests

      - name: Run optimizer
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          EVAL_COACH_MODEL: ${{ vars.EVAL_COACH_MODEL || 'gpt-4.1-mini' }}
          EVAL_JUDGE_MODEL: ${{ vars.EVAL_JUDGE_MODEL || 'gpt-4.1-mini' }}
          MUTATION_MODEL: ${{ vars.MUTATION_MODEL || 'gpt-4.1-mini' }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY repository secret is required for model-backed evals."
            exit 2
          fi
          if [ "${{ inputs.mode }}" = "eval-only" ]; then
            python orchestrator.py --eval-only --pack "${{ inputs.pack }}"
          elif [ "${{ inputs.mode }}" = "all-enabled" ]; then
            python orchestrator.py --all-enabled --optimize
          else
            python orchestrator.py --optimize --pack "${{ inputs.pack }}"
          fi

      - name: Publish summary
        if: always()
        run: |
          echo "## Skill optimizer" >> "$GITHUB_STEP_SUMMARY"
          latest_summary="$(ls -t packs/*/results/summaries/*.md 2>/dev/null | head -n 1 || true)"
          if [ -n "$latest_summary" ]; then
            cat "$latest_summary" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No summary was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-optimizer-results-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            packs/*/results/experiments/*.json
            packs/*/results/summaries/*.md
            packs/*/challenger_preview.md
